default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: flying_crews_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: flying_crews_test

production:
  primary:
    <<: *default
    database: flying_crews_production
    username: <%= ENV.fetch("DATABASE_USERNAME") { "flying_crews" } %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
  cache:
    <<: *default
    database: flying_crews_production_cache
    username: <%= ENV.fetch("DATABASE_USERNAME") { "flying_crews" } %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: flying_crews_production_queue
    username: <%= ENV.fetch("DATABASE_USERNAME") { "flying_crews" } %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
    migrations_paths: db/queue_migrate
